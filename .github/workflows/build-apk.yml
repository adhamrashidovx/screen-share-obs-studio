name: Build 64-Bit OBS TCP Streamer APK (v3.0 Smooth)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-64bit-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore v3.0 Smooth Buffer Android Project
        run: |
          echo "Deploying v3.0 Smooth Buffer Edition project files..."
          echo "" | base64 -d > /tmp/project_v3.zip
          unzip -o /tmp/project_v3.zip -d .
          ls -la app/src/main/java/uz/obsstreamer/tcp/

      - name: Set up JDK 17 (64-bit)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build 64-bit Release & Debug APK
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk OBS_TCP_Screen_v3_Smooth_64bit.apk

      - name: Verify Launcher Activity Inside Compiled APK
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          $AAPT dump badging OBS_TCP_Screen_v3_Smooth_64bit.apk | grep "launchable-activity"

      - name: Upload Ready-to-Install 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: OBS-TCP-Screen-v3-Smooth-APK
          path: |
            OBS_TCP_Screen_v3_Smooth_64bit.apk
