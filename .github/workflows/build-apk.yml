name: Build 64-Bit OBS TCP Streamer APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-64bit-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare & Verify Full Android Project Structure
        run: |
          # 1. If a .zip archive was uploaded anywhere in the repo, always extract it over the workspace
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting uploaded ZIP archive: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi

          # 2. If MainActivity.kt or ic_launcher.xml is still missing (e.g. broken folder upload on mobile),
          #    automatically restore the full project from the embedded backup payload!
          if [ ! -f "app/src/main/java/uz/obsstreamer/tcp/MainActivity.kt" ] || [ ! -f "app/src/main/res/drawable/ic_launcher.xml" ]; then
            echo "Restoring complete Android project structure from embedded backup..."
            echo "" | base64 -d > /tmp/project_backup.zip
            unzip -o /tmp/project_backup.zip -d .
          fi

          echo "Verifying MainActivity and AndroidManifest..."
          ls -la app/src/main/
          ls -la app/src/main/java/uz/obsstreamer/tcp/

      - name: Set up JDK 17 (64-bit)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build 64-bit Release & Debug APK
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk OBS_TCP_Screen_64bit.apk

      - name: Verify Launcher Activity Inside Compiled APK
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          $AAPT dump badging OBS_TCP_Screen_64bit.apk | grep "launchable-activity"

      - name: Upload Ready-to-Install 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: OBS-TCP-Screen-64bit-APK
          path: |
            OBS_TCP_Screen_64bit.apk
